features:
    enable_full_psdk: true # 启用完整 PSDK 作业流程
    enable_status_board: true # 启用终端状态板
    enable_trace_log: true # 启用更详细日志
    set_psdk_log_level: 3 # 设置 PSDK 日志级别, 0=ERROR , 1=WARN , 2=INFO , 3=DEBUG
    skip_rc: false # 尝试跳过遥控器检测
    save_kmz_file: true # 保存 KMZ 文件到本地

    # USB Bulk 链路注册策略:
    # auto=飞机已配置才注册(状态文件 host_configured=1)
    # force=无条件注册(现场测试验证)
    # off=不注册
    # 设备侧状态见 `usb_bulk_config.sh --check`
    usb_bulk: auto

catalog:
    node_id: CATBJ9TYVMX
    port: 30906
    targets:
        - 192.168.1.171
        - 192.168.1.*

plane:
    code: 1581F7FVC25CG00DJYAB
    use_mqtt_v5_server: true
    waypoint_3d_distance_tolerance: 0.5 # 3D 航点距离容差 (m)
    stick_sensitivity: 0.33
    tcp_frame_server_port: 1234
    service_reconnect_interval_s: 2 # 服务重连间隔 (s)
    max_waypoints_per_mission: 500
    max_total_waypoints: 1000
    gps_satellite_alert_threshold: 15 # GPS 卫星告警阈值
    video_quality_level: 75 # 视频质量等级 10~100
    simulator_default_longitude: "118.892591" # 模拟器默认经度
    simulator_default_latitude: "32.067228" # 模拟器默认纬度
    simulator_default_gps_count: "15" # 模拟器默认卫星数量
    custom_central_meridian: 0.0 # 自定义中央子午线 (度)
