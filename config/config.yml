features:
    enable_full_psdk: true # 启用完整 PSDK 作业流程
    enable_status_board: true # 启用终端状态板
    enable_trace_log: true # 启用更详细日志
    set_psdk_log_level: 2 # 设置 PSDK 日志级别, 0=ERROR , 1=WARN , 2=INFO , 3=DEBUG
    skip_rc: false # 尝试跳过遥控器检测
    save_kmz_file: true # 保存 KMZ 文件到本地

catalog:
    node_id: CATF4KHZBF8
    port: 30906
    targets:
        - 192.168.1.131
        - 192.168.1.*

# 设备标识与 RID 起降点 (可选):
# plane:
#     code: <设备标识>         # 未配置时使用 PSDK 飞控序列号
#     takeoff_lat: 22.5428    # RID 起降点纬度 (度; 未配置时 RID 上报 0 并告警)
#     takeoff_lon: 113.9589   # RID 起降点经度 (度)
#     takeoff_alt: 10         # RID 起降点海拔 (米)
